<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>图片标签管理</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <h2>图片标签管理</h2>
  <p class="hint">文件名即标签，例如「占卜家魔药.jpg」→ 标签：占卜家魔药</p>

  <!-- 上传区 -->
  <section class="section">
    <div class="section-header">
      <h3>上传图片</h3>
    </div>
    <div class="drop" id="drop">
      <p>点击或拖拽图片到此处上传</p>
      <input type="file" id="fileInput" accept="image/*" multiple hidden />
    </div>
  </section>

  <!-- 标签区 -->
  <section class="section">
    <div class="section-header">
      <h3>标签统计 <span class="count" id="tagCount"></span></h3>
      <button class="btn" id="refreshBtn">刷新</button>
    </div>
    <div class="tag-stats" id="tagStats">
      <p class="status">加载中…</p>
    </div>
  </section>

  <!-- 图片列表区 -->
  <section class="section">
    <div class="section-header">
      <h3>图片列表 <span class="count" id="imageCount"></span></h3>
    </div>
    <div class="image-grid" id="imageGrid">
      <p class="status">加载中…</p>
    </div>
  </section>

  <!-- 全局提示 -->
  <div class="toast" id="toast"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
