<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>图片标签管理</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <h2>图片标签管理</h2>
  <p class="hint">标签默认取文件名，可点击「改标签」手动修改，修改后会被保存。</p>

  <section class="section">
    <div class="section-header">
      <h3>上传图片</h3>
    </div>
    <div class="drop" id="drop">
      <p>点击或拖拽图片到此处上传</p>
      <input type="file" id="fileInput" accept="image/*" multiple hidden />
    </div>
  </section>

  <section class="section">
    <div class="section-header">
      <h3>标签统计 <span class="count" id="tagCount"></span></h3>
      <button class="btn" id="refreshBtn">刷新</button>
    </div>
    <div class="tag-stats" id="tagStats">
      <p class="status">加载中…</p>
    </div>
  </section>

  <section class="section">
    <div class="section-header">
      <h3>图片列表 <span class="count" id="imageCount"></span></h3>
    </div>
    <div class="image-grid" id="imageGrid">
      <p class="status">加载中…</p>
    </div>
  </section>

  <!-- 自定义弹窗（替代原生 confirm/prompt） -->
  <div class="modal-mask" id="modalMask">
    <div class="modal-box">
      <h4 id="modalTitle">标题</h4>
      <p id="modalMsg"></p>
      <input type="text" id="modalInput" />
      <div class="modal-actions">
        <button class="btn" id="modalCancel">取消</button>
        <button class="btn primary" id="modalOk">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
